<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';">
  <title data-i18n="about.title">关于</title>
  <link rel="stylesheet" href="../../styles.css?v=11">
  <script src="../../scripts/theme-init.js"></script>
  <script src="../../scripts/utils/tooltip-suppression.js"></script>
</head>
<body>
  <div class="about-window-titlebar">
    <div class="about-window-traffic-lights">
      <button class="traffic-light traffic-light-close" onclick="window.electronAPI?.closeModuleWindow()" title="关闭"></button>
    </div>
    <div class="about-window-title" data-i18n="about.title">关于</div>
  </div>
  <div class="about-window-container">
    <div class="about-window-content">
      <h1 class="about-title">Nigate</h1>
      <p data-i18n="about.description">Nigate 是基于 ntfs-3g 驱动制作的免费读写 NTFS 格式存储设备工具。</p>

      <h2 data-i18n="about.softwareInfo">软件信息</h2>
      <dl class="about-info-list">
        <div class="about-info-row">
          <dt data-i18n="about.author">作者：</dt>
          <dd>ChengLung Hwu（胡成龙）</dd>
        </div>
        <div class="about-info-row">
          <dt data-i18n="about.version">软件版本：</dt>
          <dd>Nigate v<span id="currentVersion">...</span></dd>
        </div>
        <div class="about-info-row">
          <dt data-i18n="about.technology">基于技术：</dt>
          <dd>Electron + Shell + TypeScript + Stylus</dd>
        </div>
      </dl>

      <div class="about-update-row">
        <button class="btn btn-secondary" id="checkUpdatesBtn" data-i18n="about.checkUpdates">检查更新</button>
        <p class="about-update-status" id="updateStatus" role="status" aria-live="polite" hidden>
          <span class="about-update-indicator" aria-hidden="true"></span>
          <span id="updateStatusText"></span>
        </p>
        <button class="about-release-link" id="openReleaseBtn" data-i18n="about.viewReleases" hidden>查看发布页</button>
      </div>

      <div class="about-icons-row">
        <a href="https://github.com/hoochanlon/Free-NTFS-for-Mac" target="_blank" class="about-icon-link" title="项目地址">
          <img src="../imgs/svg/social/github.svg" alt="项目地址" class="about-icon" onerror="this.style.display='none'">
        </a>
        <a href="mailto:hoochanlon@outlook.com" class="about-icon-link" title="邮箱">
          <img src="../imgs/svg/social/email.svg" alt="邮箱" class="about-icon" onerror="this.style.display='none'">
        </a>
      </div>
    </div>
  </div>

  <script src="../../scripts/utils/theme.js"></script>
  <script src="../../scripts/utils/i18n.js"></script>
  <script src="../../scripts/about-page.js"></script>
</body>
</html>
