<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>确认修复</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent !important;
      background-color: transparent !important;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .confirm-dialog {
      width: min(460px, calc(100vw - 24px));
      min-width: 0;
      max-width: 460px;
      max-height: calc(100vh - 24px);
      box-shadow: none !important;
    }
  </style>
</head>
<body>
  <section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirmDialogTitle">
    <div class="confirm-dialog-title" id="confirmDialogTitle"></div>
    <div class="confirm-dialog-content" id="confirmDialogMessage"></div>
    <div class="confirm-dialog-buttons">
      <button class="btn btn-secondary" id="cancelButton" type="button"></button>
      <button class="btn btn-primary" id="confirmButton" type="button"></button>
    </div>
  </section>
  <script>
    const { ipcRenderer } = require('electron');
    const dialogElement = document.querySelector('.confirm-dialog');
    const titleElement = document.getElementById('confirmDialogTitle');
    const messageElement = document.getElementById('confirmDialogMessage');
    const cancelButton = document.getElementById('cancelButton');
    const confirmButton = document.getElementById('confirmButton');
    let settled = false;

    function respond(confirmed) {
      if (settled) return;
      settled = true;
      ipcRenderer.send('tray-repair-confirm-response', { confirmed });
    }

    ipcRenderer.on('tray-repair-confirm-data', (_event, options) => {
      document.documentElement.classList.toggle('light-theme', options.isLightTheme);
      document.body.classList.toggle('light-theme', options.isLightTheme);
      titleElement.textContent = options.title;
      cancelButton.textContent = options.cancelText;
      confirmButton.textContent = options.confirmText;
      let list = null;
      options.message.split('\n').forEach((line, index) => {
        const trimmedLine = line.trim();
        if (!trimmedLine) {
          if (list) {
            messageElement.appendChild(list);
            list = null;
          }
          if (index < options.message.split('\n').length - 1) {
            messageElement.appendChild(document.createElement('br'));
          }
          return;
        }
        if (trimmedLine.startsWith('* ') && !trimmedLine.match(/^\*[^*]+\*$/)) {
          if (!list) list = document.createElement('ul');
          const item = document.createElement('li');
          trimmedLine.slice(2).split(/(\*[^*]+\*)/).forEach((part) => {
            if (part.startsWith('*') && part.endsWith('*') && part.length > 2) {
              const strong = document.createElement('strong');
              strong.textContent = part.slice(1, -1);
              item.appendChild(strong);
            } else if (part.trim()) {
              item.appendChild(document.createTextNode(part));
            }
          });
          list.appendChild(item);
          return;
        }
        if (list) {
          messageElement.appendChild(list);
          list = null;
        }
        const paragraph = document.createElement('p');
        trimmedLine.split(/(\*[^*]+\*)/).forEach((part) => {
          if (part.startsWith('*') && part.endsWith('*') && part.length > 2) {
            const strong = document.createElement('strong');
            strong.textContent = part.slice(1, -1);
            paragraph.appendChild(strong);
          } else if (part.trim()) {
            paragraph.appendChild(document.createTextNode(part));
          }
        });
        messageElement.appendChild(paragraph);
      });
      if (list) messageElement.appendChild(list);
      cancelButton.addEventListener('click', () => respond(false));
      confirmButton.addEventListener('click', () => respond(true));
      confirmButton.focus();
      requestAnimationFrame(() => {
        const bounds = dialogElement.getBoundingClientRect();
        ipcRenderer.send('tray-repair-confirm-layout', {
          width: bounds.width,
          height: bounds.height
        });
      });
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') respond(false);
      if (event.key === 'Enter') respond(true);
    });
  </script>
</body>
</html>
